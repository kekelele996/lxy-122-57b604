name: gb122

services:
  db:
    image: alpine:3.20
    container_name: ${COMPOSE_PROJECT_NAME:-gb122}-db
    restart: unless-stopped
    command: ["sh", "-c", "mkdir -p /data && tail -f /dev/null"]
    volumes:
      - db_data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -d /data"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-gb122}-backend
    restart: unless-stopped
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-gb122}
      NODE_ENV: production
      PORT: ${BACKEND_INTERNAL_PORT:-3000}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-0}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DB_PATH: /data/database.db
      SQLITE_SEED_PATH: /app/database/database.db
    volumes:
      - db_data:/data
    ports:
      - "${BACKEND_PORT:-19122}:${BACKEND_INTERNAL_PORT:-3000}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('http');const port=process.env.PORT||3000;const req=http.get('http://127.0.0.1:'+port+'/api/health',res=>process.exit(res.statusCode<500?0:1));req.on('error',()=>process.exit(1));req.setTimeout(3000,()=>{req.destroy();process.exit(1);});\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-gb122}-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-18122}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
